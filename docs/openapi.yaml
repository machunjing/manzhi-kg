            type: object
            properties:
              label: { type: string, example: 大语言模型 }
              value: { type: string, example: 智谱 GLM-4 }
              note: { type: string }
        retrieval:
          type: object
          properties:
            vectorTopK: { type: integer, example: 20 }
            rerankTopK: { type: integer, example: 5 }
            rrfK: { type: integer, example: 60 }
            chunkSize: { type: integer, example: 300 }
            chunkOverlap: { type: integer, example: 50 }
            temperature: { type: number, format: float, example: 0.2 }

    HealthItem:
      type: object
      properties:
        name: { type: string, example: MySQL }
        status:
          type: string
          enum: [正常, 异常, 演示状态]
        detail: { type: string, example: 连接正常 · 12 张表 }
        latencyMs: { type: integer, example: 8 }
